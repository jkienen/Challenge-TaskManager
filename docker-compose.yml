version: "3.9"

services:
  backend:
    build: ./Backend
    container_name: fastapi_backend
    ports:
      - "8000:8000"
    volumes:
      - ./Backend:/app
    environment:
      - TZ=America/Sao_Paulo
    restart: unless-stopped

  frontend:
    build: ./Frontend
    container_name: nextjs_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - TZ=America/Sao_Paulo
    restart: unless-stopped